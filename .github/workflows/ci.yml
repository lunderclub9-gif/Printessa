name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'maintenance/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migration version uniqueness report (non-blocking)
        run: |
          node -e "const fs=require('node:fs'); const path=require('node:path'); const dir='supabase/migrations'; const files=fs.readdirSync(dir).filter(f=>f.endsWith('.sql')); const seen=new Map(); for (const file of files) { const version=file.split('_')[0]; if (seen.has(version)) console.log('::warning::Duplicate Supabase migration version ' + version + ': ' + seen.get(version) + ' and ' + file); else seen.set(version,file); }"
      - name: Dependency security report (non-blocking)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { const via=(v.via || []).map(x => typeof x === 'string' ? x : x.name + ': ' + x.title).join('; '); console.log(name + ' | ' + v.severity + ' | range: ' + v.range + ' | fix: ' + JSON.stringify(v.fixAvailable) + ' | ' + via); } console.log('Total vulnerabilities:', JSON.stringify(a.metadata?.vulnerabilities || {}));"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
